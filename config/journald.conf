# Journald configuration for Raspberry Pi Zero 2 W
# Reduces SD card writes by limiting journal size and using RAM
#
# Install: sudo cp config/journald.conf /etc/systemd/journald.conf.d/rpi-chat.conf
# Apply: sudo systemctl restart systemd-journald
#
# This configuration:
# - Stores logs in RAM (volatile)
# - Limits total log size to 50MB
# - Compresses logs
# - Rate limits to prevent log spam

[Journal]
# Store logs in RAM only (lost on reboot)
# Change to "persistent" if you need logs after reboot
Storage=volatile

# Limit journal size (50MB max in RAM)
RuntimeMaxUse=50M
RuntimeKeepFree=20M
RuntimeMaxFileSize=10M

# Compress logs to save space
Compress=yes

# Rate limiting to prevent log spam
RateLimitInterval=30s
RateLimitBurst=1000

# Forward to syslog if needed
ForwardToSyslog=no
ForwardToWall=no

# How long to keep logs
MaxRetentionSec=1week

# Sync interval (reduce writes)
SyncIntervalSec=5m
