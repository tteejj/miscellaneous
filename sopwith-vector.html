<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPWITH - Vector Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            image-rendering: crisp-edges;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            font-size: 16px;
            line-height: 1.6;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            font-size: 12px;
            line-height: 1.4;
        }

        #highscores {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="info"></div>
    <div id="controls">
        W/S: Throttle | ↑/↓: Pitch | SPACE: Fire Gun | B: Drop Bomb | R: Restart
    </div>
    <div id="highscores"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        const highscoresDiv = document.getElementById('highscores');

        // Set canvas size
        canvas.width = 1200;
        canvas.height = 600;

        // Game settings
        let settings = {
            difficulty: 'normal', // easy, normal, hard
            weather: 'clear', // clear, windy, stormy
            windStrength: 0
        };

        // Settings menu state
        let settingsSelection = 0; // 0 = difficulty, 1 = weather
        let settingsOptions = {
            difficulty: ['easy', 'normal', 'hard'],
            weather: ['clear', 'windy', 'stormy']
        };

        // Game constants
        const GRAVITY = 0.15;
        const GROUND_LEVEL = canvas.height - 80;

        // Game state
        let gameState = 'start'; // start, playing, gameover, settings, nameentry
        let score = 0;
        let worldOffset = 0;
        let windEffect = 0;
        let rainDrops = [];

        // High scores
        let highScores = JSON.parse(localStorage.getItem('sopwithHighScores') || '[]');
        let playerName = ['A', 'A', 'A'];
        let nameIndex = 0;

        // Keyboard state
        const keys = {};

        // Vector drawing with glow effect
        function drawLine(x1, y1, x2, y2, color = '#0f0', width = 2) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawCircle(x, y, radius, color = '#0f0', width = 2) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawText(text, x, y, size = 16, color = '#0f0') {
            ctx.fillStyle = color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;
            ctx.font = `${size}px 'Courier New', monospace`;
            ctx.fillText(text, x, y);
            ctx.shadowBlur = 0;
        }

        // Player plane
        class Plane {
            constructor(x, y, onGround = true) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.throttle = 0;
                this.angle = 0;
                this.targetAngle = 0;
                this.health = 100;
                this.fuel = 100;
                this.onGround = onGround;
                this.crashed = false;
            }

            update() {
                if (this.crashed) return;

                // Throttle is now sticky - controlled by key events, not here

                // Pitch control - only when not on ground
                if (!this.onGround) {
                    if (keys['ArrowUp']) {
                        this.targetAngle = Math.max(this.targetAngle - 0.05, -Math.PI / 5);
                    } else if (keys['ArrowDown']) {
                        this.targetAngle = Math.min(this.targetAngle + 0.05, Math.PI / 5);
                    } else {
                        this.targetAngle *= 0.95;
                    }
                }

                // Smooth angle transition
                this.angle += (this.targetAngle - this.angle) * 0.1;

                if (this.onGround) {
                    // GROUND MECHANICS
                    // MASSIVE ground acceleration - like original Sopwith
                    const groundAccel = this.throttle * 3.0;
                    this.vx += groundAccel;

                    // Almost no friction - builds speed fast
                    this.vx *= 0.98;

                    // No vertical velocity on ground
                    this.vy = 0;
                    this.angle = 0;
                    this.targetAngle = 0;

                    // Minimal fuel consumption on ground (taxiing)
                    this.fuel = Math.max(0, this.fuel - 0.005 * this.throttle);

                    // Natural takeoff when fast enough with pitch up - very low threshold
                    if (this.vx > 2.5 && keys['ArrowUp']) {
                        this.onGround = false;
                        this.vy = -4.0; // Strong initial lift like original
                    }

                } else {
                    // AIR MECHANICS
                    // Apply thrust based on throttle and angle
                    const thrust = this.throttle * 0.15;
                    this.vx += Math.cos(this.angle) * thrust;
                    this.vy += Math.sin(this.angle) * thrust;

                    // Gravity
                    this.vy += GRAVITY;

                    // Wind effect
                    this.vx += windEffect * 0.01;

                    // Drag
                    this.vx *= 0.99;
                    this.vy *= 0.99;

                    // Speed limits
                    const maxSpeed = 10;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    // Minimum forward speed to prevent stalling
                    if (this.vx < 2.0) {
                        this.vx = Math.max(this.vx, 2.0);
                    }

                    // Fuel consumption
                    this.fuel = Math.max(0, this.fuel - 0.015 * (1 + this.throttle));
                    if (this.fuel === 0) {
                        this.crashed = true;
                        explosions.push(new Explosion(this.x + worldOffset, this.y));
                        gameState = 'gameover';
                    }
                }

                // Update position
                this.y += this.vy;

                // Find ground level at current position
                let groundLevel = GROUND_LEVEL;
                let flatSurface = true;

                // Check for airfield (flat landing area at start)
                const playerWorldX = this.x + worldOffset;
                if (playerWorldX < 500) {
                    groundLevel = GROUND_LEVEL;
                    flatSurface = true;
                } else {
                    // Check buildings for collision
                    for (let building of buildings) {
                        if (!building.destroyed && playerWorldX > building.x && playerWorldX < building.x + building.width) {
                            const buildingTop = GROUND_LEVEL - building.height;
                            const buildingLeft = building.x;
                            const buildingRight = building.x + building.width;

                            // Check if hitting side of building (not coming from above)
                            if (this.y > buildingTop + 5 && !this.onGround) {
                                // Hit the side - crash!
                                this.crashed = true;
                                explosions.push(new Explosion(this.x + worldOffset, this.y));
                                gameState = 'gameover';
                                return;
                            }

                            groundLevel = buildingTop;
                            flatSurface = building.width > 60;
                            break;
                        }
                    }
                }

                // Ground collision / landing
                if (this.y >= groundLevel - 10) {
                    this.y = groundLevel - 10;

                    // Only check landing if we were already in the air and coming down
                    if (!this.onGround && this.vy > 0) {
                        // Landing attempt - check if safe
                        const landingSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        const safeAngle = Math.abs(this.angle) < 0.3;
                        const safeSpeed = landingSpeed < 5.5;
                        const safeDescent = Math.abs(this.vy) < 3.5;

                        if (!flatSurface || !safeAngle || !safeSpeed || !safeDescent) {
                            this.crashed = true;
                            explosions.push(new Explosion(this.x + worldOffset, this.y));
                            gameState = 'gameover';
                        } else {
                            // Safe landing!
                            this.onGround = true;
                            this.vy = 0;
                            this.angle = 0;
                            this.targetAngle = 0;
                        }
                    } else if (this.onGround) {
                        // Stay on ground
                        this.vy = 0;
                    }
                } else {
                    // In the air
                    this.onGround = false;
                }

                // Keep plane in view (but allow some freedom)
                this.x = Math.max(100, Math.min(this.x, canvas.width - 100));

                // Top boundary
                if (this.y < 50) {
                    this.y = 50;
                    this.vy = Math.max(0, this.vy);
                }
            }

            draw() {
                const size = 20;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const color = this.crashed ? '#f00' : '#0f0';

                // Fuselage
                drawLine(-size, 0, size, 0, color);

                // Wings
                drawLine(-size/2, 0, -size/2, -size*0.8, color);
                drawLine(size/2, 0, size/2, -size*0.8, color);
                drawLine(-size*1.2, -size*0.8, size*1.2, -size*0.8, color);

                // Tail
                drawLine(-size, 0, -size*1.2, -size*0.5, color);
                drawLine(-size*1.2, -size*0.5, -size*1.3, -size*0.5, color);

                // Propeller (spinning speed based on throttle)
                if (!this.crashed) {
                    const propSpeed = 30 + this.throttle * 20;
                    const prop = Date.now() / propSpeed;
                    drawLine(size, -3, size + 5, -3 + Math.sin(prop) * 5, color);
                }

                // Landing gear
                drawLine(-size/3, 0, -size/3, size*0.4, color);
                drawLine(size/3, 0, size/3, size*0.4, color);
                drawCircle(-size/3, size*0.5, 3, color);
                drawCircle(size/3, size*0.5, 3, color);

                ctx.restore();
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 100;
            }

            update() {
                this.x += this.vx + windEffect * 0.02;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                drawCircle(this.x - worldOffset, this.y, 2, '#ff0', 2);
            }
        }

        // Bomb class
        class Bomb {
            constructor(x, y, vx) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = 0;
            }

            update() {
                this.x += this.vx + windEffect * 0.02;
                this.y += this.vy;
                this.vy += GRAVITY;
            }

            draw() {
                const sx = this.x - worldOffset;
                drawCircle(sx, this.y, 4, '#f80', 2);
                drawLine(sx, this.y - 5, sx, this.y - 8, '#f80', 2);
            }
        }

        // Building class
        class Building {
            constructor(x, width, height) {
                this.x = x;
                this.width = width;
                this.height = height;
                this.destroyed = false;
            }

            draw() {
                if (this.destroyed) return;

                const sx = this.x - worldOffset;
                const y = GROUND_LEVEL;

                drawLine(sx, y, sx, y - this.height, '#0f0');
                drawLine(sx, y - this.height, sx + this.width, y - this.height, '#0f0');
                drawLine(sx + this.width, y - this.height, sx + this.width, y, '#0f0');

                // Windows
                for (let i = 10; i < this.height - 10; i += 15) {
                    for (let j = 10; j < this.width - 10; j += 15) {
                        drawLine(sx + j, y - i, sx + j + 5, y - i, '#0f0', 1);
                        drawLine(sx + j, y - i, sx + j, y - i - 5, '#0f0', 1);
                        drawLine(sx + j + 5, y - i, sx + j + 5, y - i - 5, '#0f0', 1);
                        drawLine(sx + j, y - i - 5, sx + j + 5, y - i - 5, '#0f0', 1);
                    }
                }
            }

            checkCollision(obj) {
                if (this.destroyed) return false;
                return obj.x > this.x && obj.x < this.x + this.width &&
                       obj.y > GROUND_LEVEL - this.height && obj.y < GROUND_LEVEL;
            }
        }

        // Enemy plane class
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = -2;
                this.vy = 0;
                this.angle = Math.PI;
                this.destroyed = false;
                this.fireTimer = Math.random() * 200;
            }

            update() {
                this.x += this.vx;

                // AI difficulty based behavior
                let aggression = 0.3;
                if (settings.difficulty === 'easy') aggression = 0.1;
                if (settings.difficulty === 'hard') aggression = 0.6;

                // Track player
                const dx = (player.x + worldOffset) - this.x;
                const dy = player.y - this.y;
                this.y += Math.sin(Date.now() / 500 + this.x / 100) * 0.5 + dy * aggression * 0.001;

                // Fire at player occasionally
                if (settings.difficulty !== 'easy') {
                    this.fireTimer--;
                    if (this.fireTimer <= 0 && Math.abs(dx) < 300) {
                        this.fireTimer = 100 + Math.random() * 200;
                        enemyBullets.push(new Bullet(this.x, this.y, -8, dy * 0.01));
                    }
                }

                if (this.x < worldOffset - 200) {
                    this.destroyed = true;
                }
            }

            draw() {
                if (this.destroyed) return;

                const sx = this.x - worldOffset;
                const size = 15;

                ctx.save();
                ctx.translate(sx, this.y);
                ctx.rotate(this.angle);

                drawLine(-size, 0, size, 0, '#f00');
                drawLine(-size*0.8, -size*0.6, size*0.8, -size*0.6, '#f00');
                drawLine(0, 0, 0, -size*0.6, '#f00');

                ctx.restore();
            }

            checkCollision(obj) {
                if (this.destroyed) return false;
                const dx = obj.x - this.x;
                const dy = obj.y - this.y;
                return Math.sqrt(dx*dx + dy*dy) < 20;
            }
        }

        // Zeppelin class
        class Zeppelin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = -0.5;
                this.health = 5;
                this.destroyed = false;
            }

            update() {
                this.x += this.vx;
                this.y += Math.sin(Date.now() / 1000 + this.x / 200) * 0.3;

                if (this.x < worldOffset - 200) {
                    this.destroyed = true;
                }
            }

            draw() {
                if (this.destroyed) return;

                const sx = this.x - worldOffset;
                const width = 60;
                const height = 20;

                // Balloon
                ctx.save();
                ctx.translate(sx, this.y);

                drawLine(-width/2, 0, width/2, 0, '#f80', 3);
                drawLine(-width/2, -height/2, width/2, -height/2, '#f80', 2);
                drawLine(-width/2, height/2, width/2, height/2, '#f80', 2);
                drawLine(-width/2, -height/2, -width/2, height/2, '#f80', 2);
                drawLine(width/2, -height/2, width/2, height/2, '#f80', 2);

                // Gondola
                drawLine(-10, height/2, -10, height/2 + 10, '#f80');
                drawLine(10, height/2, 10, height/2 + 10, '#f80');
                drawLine(-10, height/2 + 10, 10, height/2 + 10, '#f80');

                ctx.restore();
            }

            checkCollision(obj) {
                if (this.destroyed) return false;
                const dx = obj.x - this.x;
                const dy = obj.y - this.y;
                return Math.sqrt(dx*dx + dy*dy) < 40;
            }

            hit() {
                this.health--;
                if (this.health <= 0) {
                    this.destroyed = true;
                    explosions.push(new Explosion(this.x, this.y));
                    explosions.push(new Explosion(this.x - 20, this.y - 10));
                    explosions.push(new Explosion(this.x + 20, this.y + 10));
                    return true;
                }
                return false;
            }
        }

        // AA Gun class
        class AAGun {
            constructor(x) {
                this.x = x;
                this.destroyed = false;
                this.fireTimer = 0;
                this.barrelAngle = -Math.PI / 4;
            }

            update() {
                if (this.destroyed) return;

                // Track player
                const dx = (player.x + worldOffset) - this.x;
                const dy = player.y - (GROUND_LEVEL - 15);
                this.barrelAngle = Math.atan2(dy, dx);

                // Fire at player
                this.fireTimer--;
                if (this.fireTimer <= 0 && Math.abs(dx) < 400) {
                    const fireRate = settings.difficulty === 'hard' ? 100 : 150;
                    this.fireTimer = fireRate + Math.random() * 100;

                    const bulletSpeed = 6;
                    const vx = Math.cos(this.barrelAngle) * bulletSpeed;
                    const vy = Math.sin(this.barrelAngle) * bulletSpeed;
                    enemyBullets.push(new Bullet(this.x, GROUND_LEVEL - 15, vx, vy));
                }
            }

            draw() {
                if (this.destroyed) return;

                const sx = this.x - worldOffset;
                const y = GROUND_LEVEL;

                // Base
                drawLine(sx - 10, y, sx + 10, y, '#f00', 3);
                drawLine(sx - 8, y, sx - 8, y - 8, '#f00', 2);
                drawLine(sx + 8, y, sx + 8, y - 8, '#f00', 2);

                // Barrel
                const barrelLength = 20;
                const ex = sx + Math.cos(this.barrelAngle) * barrelLength;
                const ey = y - 8 + Math.sin(this.barrelAngle) * barrelLength;
                drawLine(sx, y - 8, ex, ey, '#f00', 2);
            }

            checkCollision(obj) {
                if (this.destroyed) return false;
                const dx = obj.x - this.x;
                const dy = obj.y - GROUND_LEVEL;
                return Math.sqrt(dx*dx + dy*dy) < 15;
            }
        }

        // Explosion class
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 30;
                this.particles = [];
                for (let i = 0; i < 20; i++) {
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8
                    });
                }
            }

            update() {
                this.life--;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                });
            }

            draw() {
                const sx = this.x - worldOffset;
                const alpha = this.life / 30;
                this.particles.forEach(p => {
                    drawLine(sx + p.x, this.y + p.y,
                            sx + p.x + p.vx, this.y + p.y + p.vy,
                            `rgba(255, ${100 + alpha * 155}, 0, ${alpha})`, 2);
                });
            }
        }

        // Game objects
        let player = new Plane(100, GROUND_LEVEL - 10, true);
        let bullets = [];
        let enemyBullets = [];
        let bombs = [];
        let buildings = [];
        let enemies = [];
        let zeppelins = [];
        let aaGuns = [];
        let explosions = [];

        // Generate initial world
        function generateWorld() {
            buildings = [];
            aaGuns = [];

            // Airfield at start (clear area)
            let x = 500;

            for (let i = 0; i < 30; i++) {
                const width = 40 + Math.random() * 60;
                const height = 40 + Math.random() * 120;
                buildings.push(new Building(x, width, height));

                // Spawn AA guns on some buildings
                if (Math.random() < 0.15 && settings.difficulty !== 'easy') {
                    aaGuns.push(new AAGun(x + width / 2));
                }

                x += width + 80 + Math.random() * 200;
            }
        }

        // Weather system
        function updateWeather() {
            if (settings.weather === 'windy') {
                windEffect = Math.sin(Date.now() / 2000) * 2;
                settings.windStrength = windEffect;
            } else if (settings.weather === 'stormy') {
                windEffect = Math.sin(Date.now() / 1500) * 3 + Math.random() - 0.5;
                settings.windStrength = windEffect;

                // Rain drops
                if (Math.random() < 0.3) {
                    rainDrops.push({
                        x: Math.random() * canvas.width,
                        y: 0,
                        vy: 5 + Math.random() * 5,
                        life: 100
                    });
                }
            } else {
                windEffect = 0;
                settings.windStrength = 0;
            }

            // Update rain
            rainDrops = rainDrops.filter(drop => {
                drop.y += drop.vy;
                drop.x += windEffect * 0.5;
                drop.life--;
                return drop.y < canvas.height && drop.life > 0;
            });
        }

        function drawWeather() {
            if (settings.weather === 'stormy') {
                rainDrops.forEach(drop => {
                    drawLine(drop.x, drop.y, drop.x + windEffect, drop.y + 10,
                            'rgba(100, 150, 255, 0.3)', 1);
                });
            }
        }

        // Spawn enemies
        function spawnEnemies() {
            if (gameState !== 'playing') return;

            const spawnRate = settings.difficulty === 'easy' ? 0.005 :
                             settings.difficulty === 'normal' ? 0.01 : 0.02;

            // Enemy planes - spawn high enough to clear buildings (max building height ~120)
            if (Math.random() < spawnRate) {
                const y = 80 + Math.random() * 150; // Between 80-230, well above most buildings
                enemies.push(new Enemy(worldOffset + canvas.width + 100, y));
            }

            // Zeppelins (rare) - spawn even higher
            if (Math.random() < spawnRate * 0.2) {
                const y = 60 + Math.random() * 100; // Between 60-160, very high
                zeppelins.push(new Zeppelin(worldOffset + canvas.width + 100, y));
            }
        }

        // Fire bullet
        function fireBullet() {
            const bulletSpeed = 12;
            const vx = player.vx + Math.cos(player.angle) * bulletSpeed;
            const vy = player.vy + Math.sin(player.angle) * bulletSpeed;
            const x = player.x + worldOffset + Math.cos(player.angle) * 25;
            const y = player.y + Math.sin(player.angle) * 25;
            bullets.push(new Bullet(x, y, vx, vy));
        }

        // Drop bomb
        function dropBomb() {
            const x = player.x + worldOffset;
            const y = player.y + 10;
            bombs.push(new Bomb(x, y, player.vx));
        }

        // High score management
        function saveHighScore() {
            if (highScores.length < 10 || score > highScores[highScores.length - 1].score) {
                const name = playerName.join('');
                highScores.push({ name, score });
                highScores.sort((a, b) => b.score - a.score);
                highScores = highScores.slice(0, 10);
                localStorage.setItem('sopwithHighScores', JSON.stringify(highScores));
            }
        }

        function displayHighScores() {
            let html = '<b>HIGH SCORES</b><br>';
            highScores.forEach((hs, i) => {
                html += `${i + 1}. ${hs.name} - ${hs.score}<br>`;
            });
            highscoresDiv.innerHTML = html;
        }

        // Main game loop
        function gameLoop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'start') {
                drawText('SOPWITH', canvas.width / 2 - 80, canvas.height / 2 - 80, 32);
                drawText('Vector Edition', canvas.width / 2 - 100, canvas.height / 2 - 40, 20);
                drawText('Press SPACE to Start', canvas.width / 2 - 140, canvas.height / 2 + 10, 20);
                drawText('Press T for Settings', canvas.width / 2 - 130, canvas.height / 2 + 40, 16);

                displayHighScores();

                if (keys[' ']) {
                    gameState = 'playing';
                    player = new Plane(100, GROUND_LEVEL - 10, true);
                    bullets = [];
                    enemyBullets = [];
                    bombs = [];
                    explosions = [];
                    enemies = [];
                    zeppelins = [];
                    worldOffset = 0;
                    score = 0;
                    rainDrops = [];
                    generateWorld();
                }

                if (keys['t'] || keys['T']) {
                    gameState = 'settings';
                    keys['t'] = false;
                    keys['T'] = false;
                }

            } else if (gameState === 'settings') {
                drawText('SETTINGS', canvas.width / 2 - 70, 100, 28);

                // Difficulty option
                const diffColor = settingsSelection === 0 ? '#ff0' : '#0f0';
                drawText(settingsSelection === 0 ? '> DIFFICULTY <' : '  DIFFICULTY  ',
                        canvas.width / 2 - 100, 250, 20, diffColor);
                drawText(`< ${settings.difficulty.toUpperCase()} >`,
                        canvas.width / 2 - 80, 290, 18, diffColor);

                // Weather option
                const weatherColor = settingsSelection === 1 ? '#ff0' : '#0f0';
                drawText(settingsSelection === 1 ? '> WEATHER <' : '  WEATHER  ',
                        canvas.width / 2 - 70, 360, 20, weatherColor);
                drawText(`< ${settings.weather.toUpperCase()} >`,
                        canvas.width / 2 - 70, 400, 18, weatherColor);

                drawText('↑/↓: Select | ←/→ or ENTER: Change | ESC: Back',
                        canvas.width / 2 - 240, canvas.height - 100, 16);

            } else if (gameState === 'playing') {
                // Update weather
                updateWeather();

                // Update world scroll
                worldOffset += player.vx;

                // Update player
                player.update();

                // Spawn enemies
                spawnEnemies();

                // Update AA guns
                aaGuns.forEach(gun => gun.update());

                // Update bullets
                bullets = bullets.filter(b => {
                    b.update();

                    // Check enemy hits
                    for (let enemy of enemies) {
                        if (enemy.checkCollision(b)) {
                            enemy.destroyed = true;
                            explosions.push(new Explosion(enemy.x, enemy.y));
                            score += 100;
                            return false;
                        }
                    }

                    // Check zeppelin hits
                    for (let zep of zeppelins) {
                        if (zep.checkCollision(b)) {
                            if (zep.hit()) {
                                score += 500;
                            }
                            return false;
                        }
                    }

                    // Check AA gun hits
                    for (let gun of aaGuns) {
                        if (gun.checkCollision(b)) {
                            gun.destroyed = true;
                            explosions.push(new Explosion(gun.x, GROUND_LEVEL - 10));
                            score += 200;
                            return false;
                        }
                    }

                    return b.life > 0 && b.y < canvas.height && b.x > worldOffset - 100;
                });

                // Update enemy bullets
                enemyBullets = enemyBullets.filter(b => {
                    b.update();

                    // Check player hit
                    const dx = b.x - (player.x + worldOffset);
                    const dy = b.y - player.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 15) {
                        player.health -= 10;
                        explosions.push(new Explosion(player.x + worldOffset, player.y));
                        if (player.health <= 0) {
                            player.crashed = true;
                            gameState = 'gameover';
                        }
                        return false;
                    }

                    return b.life > 0 && b.y < canvas.height;
                });

                // Update bombs
                bombs = bombs.filter(b => {
                    b.update();

                    // Check building hits
                    for (let building of buildings) {
                        if (building.checkCollision(b)) {
                            building.destroyed = true;
                            explosions.push(new Explosion(b.x, GROUND_LEVEL - building.height/2));
                            score += 50;
                            return false;
                        }
                    }

                    // Check AA gun hits
                    for (let gun of aaGuns) {
                        if (gun.checkCollision(b)) {
                            gun.destroyed = true;
                            explosions.push(new Explosion(gun.x, GROUND_LEVEL - 10));
                            score += 200;
                            return false;
                        }
                    }

                    if (b.y >= GROUND_LEVEL) {
                        explosions.push(new Explosion(b.x, GROUND_LEVEL));
                        return false;
                    }

                    return true;
                });

                // Update enemies
                enemies = enemies.filter(e => {
                    e.update();

                    if (e.checkCollision({x: player.x + worldOffset, y: player.y})) {
                        player.crashed = true;
                        explosions.push(new Explosion(player.x + worldOffset, player.y));
                        gameState = 'gameover';
                    }

                    return !e.destroyed;
                });

                // Update zeppelins
                zeppelins = zeppelins.filter(z => {
                    z.update();

                    if (z.checkCollision({x: player.x + worldOffset, y: player.y})) {
                        player.crashed = true;
                        explosions.push(new Explosion(player.x + worldOffset, player.y));
                        gameState = 'gameover';
                    }

                    return !z.destroyed;
                });

                // Update explosions
                explosions = explosions.filter(e => {
                    e.update();
                    return e.life > 0;
                });

                // Check building collisions with player
                for (let building of buildings) {
                    if (!building.destroyed &&
                        building.checkCollision({x: player.x + worldOffset, y: player.y})) {
                        player.crashed = true;
                        explosions.push(new Explosion(player.x + worldOffset, player.y));
                        gameState = 'gameover';
                    }
                }

                // Draw ground
                drawLine(0, GROUND_LEVEL, canvas.width, GROUND_LEVEL, '#0f0');

                // Draw airfield at start
                const airfieldX = -worldOffset;
                if (airfieldX > -200 && airfieldX < canvas.width) {
                    drawLine(airfieldX, GROUND_LEVEL, airfieldX + 400, GROUND_LEVEL, '#ff0', 3);
                    drawText('AIRFIELD', airfieldX + 150, GROUND_LEVEL + 20, 14, '#ff0');
                }

                // Draw horizon
                for (let i = 0; i < 5; i++) {
                    const y = 50 + i * 30;
                    const offset = (worldOffset * (0.2 + i * 0.1)) % 100;
                    for (let x = -offset; x < canvas.width; x += 100) {
                        drawLine(x, y, x + 50, y, '#0f0', 1);
                    }
                }

                // Draw weather
                drawWeather();

                // Draw buildings
                buildings.forEach(b => b.draw());

                // Draw AA guns
                aaGuns.forEach(g => g.draw());

                // Draw enemies
                enemies.forEach(e => e.draw());

                // Draw zeppelins
                zeppelins.forEach(z => z.draw());

                // Draw bullets
                bullets.forEach(b => b.draw());
                enemyBullets.forEach(b => b.draw());

                // Draw bombs
                bombs.forEach(b => b.draw());

                // Draw explosions
                explosions.forEach(e => e.draw());

                // Draw player
                player.draw();

                // Draw HUD
                const throttleBar = '█'.repeat(Math.floor(player.throttle * 10));
                const throttleEmpty = '░'.repeat(10 - Math.floor(player.throttle * 10));
                const fuelBar = '|'.repeat(Math.floor(player.fuel / 10));
                const healthBar = '|'.repeat(Math.floor(player.health / 10));
                const statusMsg = player.onGround ?
                    (player.vx < 2.5 ? 'ON GROUND - Accelerate (W)!' : 'ON GROUND - READY! Pull up!') :
                    'AIRBORNE';

                info.innerHTML = `
                    SCORE: ${score}<br>
                    STATUS: ${statusMsg}<br>
                    ALTITUDE: ${Math.floor(GROUND_LEVEL - player.y)}ft<br>
                    SPEED: ${Math.floor(Math.sqrt(player.vx * player.vx + player.vy * player.vy) * 10)}kts (vx: ${player.vx.toFixed(1)})<br>
                    <b>THROTTLE: ${throttleBar}${throttleEmpty} ${Math.floor(player.throttle * 100)}%</b><br>
                    FUEL: ${fuelBar}<br>
                    HEALTH: ${healthBar}<br>
                    ${settings.weather !== 'clear' ? 'WIND: ' + windEffect.toFixed(1) : ''}
                `;

                displayHighScores();

            } else if (gameState === 'gameover') {
                // Continue drawing game state
                drawLine(0, GROUND_LEVEL, canvas.width, GROUND_LEVEL, '#0f0');
                buildings.forEach(b => b.draw());
                aaGuns.forEach(g => g.draw());
                enemies.forEach(e => e.draw());
                zeppelins.forEach(z => z.draw());
                bullets.forEach(b => b.draw());
                bombs.forEach(b => b.draw());
                explosions.forEach(e => {
                    e.update();
                    e.draw();
                });
                player.draw();

                drawText('CRASHED!', canvas.width / 2 - 80, canvas.height / 2 - 50, 32, '#f00');
                drawText(`Final Score: ${score}`, canvas.width / 2 - 100, canvas.height / 2, 20);

                // Check if high score
                const isHighScore = highScores.length < 10 || score > highScores[highScores.length - 1]?.score || 0;
                if (isHighScore) {
                    drawText('NEW HIGH SCORE!', canvas.width / 2 - 120, canvas.height / 2 + 30, 18, '#ff0');
                    drawText('Press N to Enter Name', canvas.width / 2 - 140, canvas.height / 2 + 60, 16);
                }

                drawText('Press R to Restart', canvas.width / 2 - 120, canvas.height / 2 + 90, 16);

                info.innerHTML = `SCORE: ${score}<br>CRASHED!`;
                displayHighScores();

            } else if (gameState === 'nameentry') {
                drawText('ENTER YOUR NAME', canvas.width / 2 - 150, 200, 24);
                drawText('Use Arrow Keys, Press ENTER when done', canvas.width / 2 - 240, 240, 14);

                const name = playerName.join('');
                for (let i = 0; i < 3; i++) {
                    const color = i === nameIndex ? '#ff0' : '#0f0';
                    drawText(playerName[i], canvas.width / 2 - 30 + i * 30, 300, 32, color);
                }

                drawText(`Score: ${score}`, canvas.width / 2 - 60, 360, 20);
            }

            requestAnimationFrame(gameLoop);
        }

        // Keyboard handling
        let lastFire = 0;
        let lastBomb = 0;
        let lastThrottle = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (gameState === 'playing') {
                // Sticky throttle control - each press adjusts by 25%
                if ((e.key.toLowerCase() === 'w') && Date.now() - lastThrottle > 100) {
                    player.throttle = Math.min(player.throttle + 0.25, 1.0);
                    lastThrottle = Date.now();
                    e.preventDefault();
                }
                if ((e.key.toLowerCase() === 's') && Date.now() - lastThrottle > 100) {
                    player.throttle = Math.max(player.throttle - 0.25, 0.0);
                    lastThrottle = Date.now();
                    e.preventDefault();
                }

                if (e.key === ' ' && Date.now() - lastFire > 150) {
                    fireBullet();
                    lastFire = Date.now();
                    e.preventDefault();
                }

                if (e.key.toLowerCase() === 'b' && Date.now() - lastBomb > 500) {
                    dropBomb();
                    lastBomb = Date.now();
                    e.preventDefault();
                }
            }

            if (gameState === 'settings') {
                if (e.key === 'ArrowUp') {
                    settingsSelection = 0;
                }
                if (e.key === 'ArrowDown') {
                    settingsSelection = 1;
                }
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Enter') {
                    if (settingsSelection === 0) {
                        // Cycle difficulty
                        const options = settingsOptions.difficulty;
                        const currentIndex = options.indexOf(settings.difficulty);
                        const newIndex = e.key === 'ArrowLeft' ?
                            (currentIndex - 1 + options.length) % options.length :
                            (currentIndex + 1) % options.length;
                        settings.difficulty = options[newIndex];
                    } else if (settingsSelection === 1) {
                        // Cycle weather
                        const options = settingsOptions.weather;
                        const currentIndex = options.indexOf(settings.weather);
                        const newIndex = e.key === 'ArrowLeft' ?
                            (currentIndex - 1 + options.length) % options.length :
                            (currentIndex + 1) % options.length;
                        settings.weather = options[newIndex];
                    }
                }
                if (e.key === 'Escape') {
                    gameState = 'start';
                }
                e.preventDefault();
            }

            if (gameState === 'gameover') {
                if (e.key.toLowerCase() === 'r') {
                    gameState = 'start';
                }
                if (e.key.toLowerCase() === 'n') {
                    const isHighScore = highScores.length < 10 ||
                                       score > highScores[highScores.length - 1]?.score || 0;
                    if (isHighScore) {
                        gameState = 'nameentry';
                        playerName = ['A', 'A', 'A'];
                        nameIndex = 0;
                    }
                }
            }

            if (gameState === 'nameentry') {
                if (e.key === 'ArrowLeft') {
                    nameIndex = Math.max(0, nameIndex - 1);
                }
                if (e.key === 'ArrowRight') {
                    nameIndex = Math.min(2, nameIndex + 1);
                }
                if (e.key === 'ArrowUp') {
                    let code = playerName[nameIndex].charCodeAt(0);
                    code++;
                    if (code > 90) code = 65;
                    playerName[nameIndex] = String.fromCharCode(code);
                }
                if (e.key === 'ArrowDown') {
                    let code = playerName[nameIndex].charCodeAt(0);
                    code--;
                    if (code < 65) code = 90;
                    playerName[nameIndex] = String.fromCharCode(code);
                }
                if (e.key === 'Enter') {
                    saveHighScore();
                    gameState = 'start';
                }
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start game loop
        displayHighScores();
        gameLoop();
    </script>
</body>
</html>
