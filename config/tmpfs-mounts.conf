# tmpfs configuration for RPI Chat on Pi Zero 2 W
# Add these lines to /etc/fstab to reduce SD card writes
#
# IMPORTANT: Backup your /etc/fstab before editing!
#
# Usage:
#   1. Create mount points: sudo mkdir -p /var/log/rpi-chat /tmp/rpi-chat
#   2. Add these lines to /etc/fstab
#   3. Run: sudo mount -a
#   4. Verify: df -h

# Temporary files in RAM (50MB should be enough)
tmpfs    /tmp/rpi-chat           tmpfs   defaults,noatime,nosuid,nodev,mode=1777,size=50M    0 0

# Log files in RAM (30MB - logs are also sent to journald)
tmpfs    /var/log/rpi-chat       tmpfs   defaults,noatime,nosuid,nodev,mode=0755,size=30M    0 0

# System-wide optimizations (optional but recommended)
# Reduce writes to /tmp
tmpfs    /tmp                    tmpfs   defaults,noatime,nosuid,nodev,mode=1777,size=100M   0 0

# Reduce writes to /var/log (if not using persistent logging)
# WARNING: Logs will be lost on reboot!
# tmpfs    /var/log                tmpfs   defaults,noatime,nosuid,nodev,mode=0755,size=50M    0 0
