# Opentrack Profile: Seated Gaming (Kinect Gen 1)
# Optimized for seated position gaming (Elite Dangerous, DCS, racing sims)
# Load in Opentrack: File → Open Profile

[opentrack-ui]
center-at-startup=true
tray-enabled=true
tray-start=false

[tracker-kinect]
# Kinect-specific settings
seated-mode=true
near-mode=true
enable-shape-model=false
elevation-angle=0
camera-fps=30

[filter-accela]
# Accela filter for smooth but responsive tracking
smoothing=0.7
deadzone-degrees=1.0
responsiveness=0.4
rotation-sensitivity=1.0
translation-sensitivity=1.0

[output-freetrack]
# freetrack 2.0 Enhanced for game compatibility
protocol=2
use-trackir=true

[mapping]
# Yaw (left/right) - Exponential curve for natural feel
yaw-p0-x=0
yaw-p0-y=0
yaw-p1-x=10
yaw-p1-y=25
yaw-p2-x=20
yaw-p2-y=60
yaw-p3-x=30
yaw-p3-y=90
yaw-max-input=40
yaw-max-output=120

# Pitch (up/down) - Less aggressive
pitch-p0-x=0
pitch-p0-y=0
pitch-p1-x=10
pitch-p1-y=20
pitch-p2-x=20
pitch-p2-y=45
pitch-max-input=25
pitch-max-output=60

# Roll (tilt) - Minimal, 1:1 mapping
roll-p0-x=0
roll-p0-y=0
roll-p1-x=10
roll-p1-y=10
roll-max-input=15
roll-max-output=15

# Translation X (left/right lean)
tx-p0-x=0
tx-p0-y=0
tx-p1-x=5
tx-p1-y=15
tx-p2-x=10
tx-p2-y=25
tx-max-input=15
tx-max-output=30

# Translation Y (up/down)
ty-p0-x=0
ty-p0-y=0
ty-p1-x=5
ty-p1-y=10
ty-max-input=10
ty-max-output=20

# Translation Z (forward/back)
tz-p0-x=0
tz-p0-y=0
tz-p1-x=5
tz-p1-y=15
tz-p2-x=10
tz-p2-y=25
tz-max-input=15
tz-max-output=30

[shortcuts]
# Keyboard shortcuts
center=Home
toggle=Pause
zero=End
