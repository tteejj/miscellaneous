<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initial Setup - RPi Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .setup-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
            text-align: center;
        }

        .info {
            background: #e3f2fd;
            color: #1976d2;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <h1>🔧 Initial Setup</h1>

        <div class="info">
            Welcome! Create your admin account to get started. This page is only accessible from localhost for security.
        </div>

        <div class="error" id="errorMsg"></div>

        <form id="setupForm" onsubmit="handleSetup(event)">
            <div class="form-group">
                <label for="username">Admin Username:</label>
                <input type="text" id="username" required autofocus placeholder="Your username">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required minlength="6" placeholder="Min 6 characters">
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirm Password:</label>
                <input type="password" id="passwordConfirm" required minlength="6" placeholder="Re-enter password">
            </div>

            <button type="submit">Complete Setup</button>
        </form>
    </div>

    <script>
        function showError(message) {
            var errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.className = errorMsg.className + ' show';
        }

        function hideError() {
            var errorMsg = document.getElementById('errorMsg');
            errorMsg.className = errorMsg.className.replace(' show', '');
        }

        function handleSetup(event) {
            event.preventDefault();
            hideError();

            var username = document.getElementById('username').value.replace(/^\s+|\s+$/g, '');
            var password = document.getElementById('password').value;
            var passwordConfirm = document.getElementById('passwordConfirm').value;

            if (!username) {
                showError('Username is required');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (password !== passwordConfirm) {
                showError('Passwords do not match');
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/setup', true);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (xhr.status === 200) {
                            alert('Setup complete! Redirecting to chat...');
                            window.location.href = '/';
                        } else {
                            showError(data.error || 'Setup failed');
                        }
                    } catch (e) {
                        showError('Setup failed. Please try again.');
                    }
                }
            };

            xhr.onerror = function() {
                showError('Setup failed. Please try again.');
            };

            xhr.send(JSON.stringify({ username: username, password: password }));
        }
    </script>
</body>
</html>
